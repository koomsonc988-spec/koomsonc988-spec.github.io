<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC UniScan Box - Powered by Tandoh Caleb</title>
<script src="https://quge5.com/88/tag.min.js" data-zone="305025" async data-cfasync="false"></script>
<script>(function(s){s.dataset.zone='12177771',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
body{text-align:center;font-family:Arial;padding:10px;background:#000;margin:0;min-height:100vh;color:white}
.box{background:white;color:#333;padding:20px;border-radius:20px;max-width:420px;margin:15px auto;box-shadow:0 0 25px rgba(255,215,0,0.4)}
button{padding:14px;color:white;border:none;border-radius:12px;width:100%;font-size:16px;margin-top:10px;cursor:pointer;font-weight:bold}
.btn-tc{background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b);color:#000}
.btn-dark{background:#2d3436}
.btn-green{background:#00b894}
#preview,#video{width:100%;border-radius:15px;display:none;margin-top:15px;max-height:380px;object-fit:cover;background:black}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{flex:1;padding:12px;border-radius:12px;border:2px solid #b8860b;background:white;color:#b8860b;font-weight:bold}
.tab.active{background:linear-gradient(90deg,#b8860b,#ffd700);color:#000}
.hot-bar{height:22px;background:#eee;border-radius:11px;overflow:hidden;margin:10px 0}
.hot-fill{height:100%;background:linear-gradient(90deg,#b8860b,#ffd700);width:0%;transition:width 2s}
.logo{width:150px;height:150px;border-radius:20px;margin:15px auto;display:block;box-shadow:0 0 20px gold;object-fit:cover}
</style>
</head>
<body>
<img src="logo.png" class="logo" alt="TC Logo">
<h2 style="color:gold;margin:5px 0">TC UniScan Box</h2>
<p style="font-size:12px;color:#aaa;margin:0 0 10px">Powered by Tandoh Caleb</p>
<div class="box">
<h3 style="margin-top:0">🔥 AI Hotness Scanner</h3>
<div class="tabs">
<button class="tab active" id="tabUpload" onclick="switchMode('upload')">📁 Upload</button>
<button class="tab" id="tabCamera" onclick="switchMode('camera')">📷 Camera</button>
</div>
<div id="uploadDiv"><input type="file" id="photo" accept="image/*" style="width:100%;padding:10px;background:#f9f9f9;border-radius:10px"></div>
<div id="cameraDiv" style="display:none">
<video id="video" autoplay playsinline></video>
<button class="btn-dark" id="openCam" onclick="startCamera()">▶️ Open Camera</button>
<button class="btn-dark" id="snapBtn" style="display:none" onclick="takePhoto()">📸 Take Photo</button>
<button class="btn-dark" id="flipBtn" style="display:none" onclick="flipCamera()">🔄 Flip</button>
</div>
<img id="preview"><canvas id="canvas" style="display:none"></canvas>
<div id="result"></div>
<button class="btn-tc" id="btn" style="display:none;" onclick="showResult()">🚀 SCAN WITH TC BOX</button>
<button class="btn-green" id="shareBtn" style="display:none;" onclick="shareResult()">📲 Share Result</button>
<div style="font-size:11px;opacity:0.6;margin-top:15px">© 2026 TC UniScan Box | Powered by Tandoh Caleb<br>Gold Edition v3.0</div>
</div>
<script>
let p=document.getElementById('photo'),pr=document.getElementById('preview'),r=document.getElementById('result'),b=document.getElementById('btn'),shareBtn=document.getElementById('shareBtn');
let video=document.getElementById('video'),canvas=document.getElementById('canvas'),snapBtn=document.getElementById('snapBtn'),openCam=document.getElementById('openCam'),flipBtn=document.getElementById('flipBtn');
let stream=null,facing="user",lastScore=0;
function switchMode(m){
  document.getElementById('tabUpload').classList.toggle('active',m=='upload');
  document.getElementById('tabCamera').classList.toggle('active',m=='camera');
  document.getElementById('uploadDiv').style.display=m=='upload'?'block':'none';
  document.getElementById('cameraDiv').style.display=m=='camera'?'block':'none';
  if(m!='camera') stopCamera();
}
p.onchange=e=>{let f=e.target.files[0];if(f) loadImage(URL.createObjectURL(f));};
function loadImage(src){pr.src=src;pr.style.display='block';video.style.display='none';b.style.display='block';r.innerHTML='';shareBtn.style.display='none';}
async function startCamera(){
  stopCamera();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});
    video.srcObject=stream;video.style.display='block';pr.style.display='none';
    snapBtn.style.display='block';flipBtn.style.display='block';openCam.style.display='none';
  }catch(e){alert("Allow camera & use HTTPS");}
}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function flipCamera(){facing=facing=="user"?"environment":"user";startCamera();}
function takePhoto(){
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  let dataUrl=canvas.toDataURL('image/jpeg');
  stopCamera();video.style.display='none';snapBtn.style.display='none';flipBtn.style.display='none';
  openCam.style.display='block';openCam.innerText="🔁 Retake";loadImage(dataUrl);
}
function showResult(){
  b.style.display='none';
  r.innerHTML='<p>⏳ TC BOX Analyzing...<br>AI scanning hotness...</p><div class="hot-bar"><div class="hot-fill" id="fill"></div></div><p>Please wait...</p>';
  let fill=document.getElementById('fill'); setTimeout(()=>fill.style.width='100%',100);
  setTimeout(()=>{
    lastScore=Math.floor(Math.random()*22)+78;
    let msg=lastScore>95?"🔥🔥 ULTRA HOT! TC Certified!":lastScore>88?"🔥 Very Hot - Top 1%":"😍 Hot!";
    r.innerHTML=`<h1 style="font-size:55px;margin:10px 0;color:#b8860b">${lastScore}% HOT</h1><div class="hot-bar"><div class="hot-fill" style="width:${lastScore}%"></div></div><h3>${msg}</h3><p>Verified by <b>TC UniScan Box</b><br>Powered by <b>Tandoh Caleb</b></p>`;
    shareBtn.style.display='block';
  },4000);
}
function shareResult(){
  let txt=`I got ${lastScore}% HOT on TC UniScan Box 📦 Powered by Tandoh Caleb! Check: ${location.href}`;
  if(navigator.share){navigator.share({title:'TC UniScan Box',text:txt});}else{alert(txt);}
}
</script>
</body>
</html>
