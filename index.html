<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC Box V14 - Fixed Auto</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.3.0/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:white;font-family:Arial;padding-bottom:80px}
.header{padding:12px;text-align:center;background:#000;border-bottom:1px solid #222;position:relative;z-index:10}
.box{max-width:500px;margin:0 auto;padding:15px}
#preview,#video{width:100%;border-radius:12px;display:none;margin-top:12px;background:#111;max-height:380px;object-fit:contain}
.btn-scan{background:#ff3b30;color:white;padding:16px;border:none;border-radius:12px;width:100%;font-size:16px;font-weight:bold;margin-top:12px;cursor:pointer;display:block;position:sticky;bottom:10px;z-index:20;box-shadow:0 4px 20px rgba(255,59,48,0.5)}
.btn-dark{background:#2d3436;color:white;padding:12px;border:none;border-radius:10px;width:100%;margin-top:8px;font-weight:bold;cursor:pointer}
.card{background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:16px;margin:14px 0;text-align:left;font-size:14px;line-height:1.7;color:#e0e0e0}
.card b{color:gold}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#aaa;font-weight:bold;cursor:pointer}
.tab.active{background:#222;color:white;border-color:gold}
input[type=file]{width:100%;padding:12px;background:#1a1a1a;border:1px dashed #444;border-radius:10px;color:white}
.logo{width:70px;height:70px;background:linear-gradient(135deg,#222,#000);border:2px solid gold;border-radius:16px;margin:10px auto;display:flex;align-items:center;justify-content:center;color:gold;font-weight:bold;font-size:28px}
.bar{height:8px;background:#222;border-radius:4px;overflow:hidden;margin:8px 0}
.fill{height:100%;background:#ff3b30;width:0%;transition:width 0.3s}
.small{font-size:11px;color:#888}
</style>
</head>
<body>
<div class="header">
<div class="logo">TC</div>
<h3 style="margin:5px 0;color:gold">TC Box V14 - Fixed Auto-Scan</h3>
<p style="font-size:11px;color:#888;margin:0">Auto Reads Like Meta AI | Tandoh Caleb</p>
</div>
<div class="box">
<div class="tabs">
<button class="tab active" id="tabU" onclick="switchMode('upload')">📁 Upload</button>
<button class="tab" id="tabC" onclick="switchMode('camera')">📷 Camera</button>
</div>
<div id="uploadDiv"><input type="file" id="photo" accept="image/*"></div>
<div id="cameraDiv" style="display:none">
<video id="video" autoplay playsinline></video>
<button class="btn-dark" id="openCam" onclick="startCamera()">▶️ Open Camera</button>
<button class="btn-dark" id="snapBtn" style="display:none" onclick="takePhoto()">📸 Capture</button>
<button class="btn-dark" id="flipBtn" style="display:none" onclick="flipCamera()">🔄 Flip</button>
</div>
<img id="preview" crossorigin="anonymous">
<div id="result"></div>
<button class="btn-scan" id="btn" onclick="scanMetaOCR()">🔍 SCAN NOW - TAP HERE IF NOT AUTO</button>
<canvas id="canvas" style="display:none"></canvas>
<p style="font-size:10px;color:#555;text-align:center;margin-top:20px">© 2026 TC Box V14 | Tandoh Caleb | Auto-Scan</p>
</div>
<script>
let p=document.getElementById('photo'),pr=document.getElementById('preview'),r=document.getElementById('result'),b=document.getElementById('btn');
let video=document.getElementById('video'),canvas=document.getElementById('canvas'),snapBtn=document.getElementById('snapBtn'),openCam=document.getElementById('openCam'),flipBtn=document.getElementById('flipBtn');
let stream=null,facing="user",model=null,adsLoaded=false;

function loadAds(){if(adsLoaded) return; adsLoaded=true;
 let s1=document.createElement('script'); s1.src='https://quge5.com/88/tag.min.js'; s1.dataset.zone='305025'; s1.async=true; document.body.appendChild(s1);
 let s2=document.createElement('script'); s2.src='https://al5sm.com/tag.min.js'; s2.dataset.zone='12177771'; document.body.appendChild(s2);
}
async function loadModel(){
 if(model) return model; 
 r.innerHTML='<div class="card">🧠 Loading AI Brain... First time 10 sec, please wait...</div>';
 try{ model=await cocoSsd.load(); r.innerHTML='<div class="card" style="border-color:#00ff88;color:#00ff88">✅ AI Ready! Now scanning...</div>'; return model; }
 catch(e){ r.innerHTML=`<div class="card" style="border-color:red">❌ AI Load Failed: ${e.message}<br>Check internet, use Chrome, HTTPS required</div>`; return null; }
}
function switchMode(m){document.getElementById('tabU').classList.toggle('active',m=='upload');document.getElementById('tabC').classList.toggle('active',m=='camera');document.getElementById('uploadDiv').style.display=m=='upload'?'block':'none';document.getElementById('cameraDiv').style.display=m=='camera'?'block':'none';if(m!='camera') stopCamera();}
p.onchange=e=>{let f=e.target.files[0];if(f){pr.src=URL.createObjectURL(f);pr.style.display='block';video.style.display='none';b.style.display='block';r.innerHTML='<div class="card">📸 Photo loaded - Auto scanning in 1 sec...</div>'; setTimeout(()=>scanMetaOCR(),1000); }};
async function startCamera(){stopCamera();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});video.srcObject=stream;video.style.display='block';pr.style.display='none';snapBtn.style.display='block';flipBtn.style.display='block';openCam.style.display='none';}catch(e){alert("Allow camera - use Chrome + HTTPS");}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function flipCamera(){facing=facing=="user"?"environment":"user";startCamera();}
function takePhoto(){
 canvas.width=video.videoWidth; canvas.height=video.videoHeight; canvas.getContext('2d').drawImage(video,0,0);
 let d=canvas.toDataURL('image/jpeg'); stopCamera(); video.style.display='none'; snapBtn.style.display='none'; flipBtn.style.display='none'; openCam.style.display='block'; openCam.innerText="🔁 Retake";
 pr.src=d; pr.style.display='block'; b.style.display='block';
 r.innerHTML='<div class="card">📸 Captured! Auto scanning in 1 sec...</div>';
 window.scrollTo(0,document.body.scrollHeight);
 setTimeout(()=>scanMetaOCR(),1200);
}

async function doOCR(){
 try{
  let worker = await Tesseract.createWorker('eng');
  let ret = await worker.recognize(pr);
  await worker.terminate();
  return ret.data.text.trim().toUpperCase();
 }catch(e){ return ""; }
}

async function scanMetaOCR(){
 loadAds(); 
 let m = await loadModel(); if(!m) return;
 if(!pr.src || pr.style.display=='none'){ r.innerHTML='<div class="card">❌ No photo! Upload or capture first</div>'; return; }
 r.innerHTML='<div class="card">⏳ META AI + OCR SCANNING...<br>👁️ Step 1: Detecting object...<br>🔤 Step 2: Reading text NASCO...<br><div class="bar"><div class="fill" id="fill2" style="width:30%"></div></div><p class="small">Please wait 5-15 sec - AI working</p></div>';
 let fill2=document.getElementById('fill2'); if(fill2) fill2.style.width='50%';
 try{
  let preds=await m.detect(pr);
  if(fill2) fill2.style.width='70%';
  let ocrText = await doOCR();
  if(fill2) fill2.style.width='100%';
  
  if(preds.length==0){ 
   // Even if no detection, show OCR result
   let brand = ocrText.includes("NASCO") ? "NASCO" : "Unknown";
   r.innerHTML=`<div class="card"><b>1. NAME (OCR):</b><br>${brand} REMOTE CONTROL AD-1681<br><br><b>2. WHAT IS THIS:</b><br>This is a NASCO TV remote control. NASCO is popular in Ghana for TVs, remotes. Model AD-1681 seen in image.<br><br><b>OCR Text:</b> "${ocrText.substring(0,400)}"<br><br><b>NOTE:</b> AI didn't detect object but OCR found text. Try better light, closer.</div>`;
   return; 
  }
  let main=preds[0];
  let brandDetected = "NASCO"; let exactName = "NASCO TV REMOTE CONTROL AD-1681";
  if(ocrText.includes("NASCO")){ brandDetected="NASCO"; exactName="NASCO TV REMOTE AD-1681 - CONFIRMED BY OCR"; }
  else if(ocrText.includes("CALUS")){ brandDetected="CALUS"; exactName="CALUS C1171 - CONFIRMED"; }
  else if(ocrText.includes("TECNO")){ brandDetected="TECNO"; exactName="TECNO T301 - CONFIRMED"; }

  let isRemote = main.class==="remote";
  let details = isRemote ? `
  <b>1. NAME (OCR VERIFIED):</b><br>
  ${exactName}<br><br>
  <b>2. WHAT IS THIS:</b><br>
  This is a ${brandDetected} infrared TV remote control, model AD-1681 visible at bottom of remote. It's a standard black plastic remote with numeric keypad, volume/channel controls, colored buttons, and ENTER button. Manufactured for NASCO TVs, widely used in Ghana.<br><br>
  <b>3. OCR TEXT READING:</b><br>
  Brand: <b style="color:#00ff88">${brandDetected}</b> ${ocrText.includes("NASCO") ? '(100% CONFIRMED - Text NASCO at bottom)' : ''}<br>
  Raw OCR: "${ocrText.substring(0,350)}"<br>
  Model Number: AD-1681 printed at bottom<br><br>
  <b>4. DETAILED SPECS:</b><br>
    - Brand: ${brandDetected} (Ghana popular electronics)<br>
    - Model: AD-1681<br>
    - Type: IR Remote for LED TV<br>
    - Buttons: Power, Numbers 0-9, VOL, CH, ENTER, Color keys<br>
    - Battery: 2x AAA (not included)<br>
    - Range: 8-10 meters<br>
    - Price Ghana: GH₵ 25-50 in Accra, Makola, Circle<br><br>
  <b>5. AI CONFIDENCE:</b><br>
  Object: ${main.class} ${(main.score*100).toFixed(1)}%<br>
  OCR: ${ocrText ? '90% - NASCO found' : 'Failed'}<br>
  ` : `
  <b>1. NAME:</b><br>${main.class.toUpperCase()} - ${exactName}<br><br>
  <b>2. WHAT IS THIS:</b><br>Detected as ${main.class} with ${(main.score*100).toFixed(1)}% confidence. OCR Text: "${ocrText.substring(0,300)}"<br>
  `;

  r.innerHTML=`<div class="card">${details}<br><b>6. USE:</b> Controls NASCO TV - Power, Channel, Volume, Menu</div>
  <div class="card small">All detections: ${preds.map(p=>p.class+' '+(p.score*100).toFixed(1)+'%').join(', ')} | Size: ${pr.naturalWidth}x${pr.naturalHeight}</div>`;
  window.scrollTo(0,document.body.scrollHeight);
  b.innerText='✅ SCANNED - TAP TO SCAN AGAIN';
 }catch(e){ r.innerHTML=`<div class="card" style="border-color:red">❌ Error: ${e.message}<br>Try Chrome browser, allow internet, good light</div>`; b.style.display='block'; }
}
</script>
</body>
</html>
