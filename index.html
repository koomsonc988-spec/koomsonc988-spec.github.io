<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC UniScan Box - Powered by Tandoh Caleb</title>
<script src="https://quge5.com/88/tag.min.js" data-zone="305025" async data-cfasync="false"></script>
<script>(function(s){s.dataset.zone='12177771',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
body{text-align:center;font-family:Arial;padding:10px;background:#000;margin:0;color:white}
.box{background:white;color:#333;padding:18px;border-radius:20px;max-width:460px;margin:15px auto;box-shadow:0 0 25px gold}
button{padding:14px;border:none;border-radius:12px;width:100%;font-size:15px;margin-top:10px;font-weight:bold;cursor:pointer}
.btn-tc{background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b);color:#000}
.btn-dark{background:#2d3436;color:white}
.btn-green{background:#00b894;color:white}
#preview,#video{width:100%;border-radius:15px;display:none;margin-top:12px;max-height:380px;object-fit:cover;background:black}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:11px;border-radius:10px;border:2px solid #b8860b;background:white;color:#b8860b;font-weight:bold}
.tab.active{background:linear-gradient(90deg,#b8860b,#ffd700);color:#000}
.bar{height:18px;background:#eee;border-radius:9px;overflow:hidden;margin:8px 0}
.fill{height:100%;background:linear-gradient(90deg,#b8860b,#ffd700);width:0%;transition:width 2s}
.card{background:#f8f9fa;border-radius:12px;padding:12px;margin:8px 0;text-align:left;border-left:4px solid gold;font-size:14px;line-height:1.5}
.logo-box{width:90px;height:90px;background:linear-gradient(135deg,#000,#222);border:3px solid gold;border-radius:18px;margin:12px auto;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold;color:gold;box-shadow:0 0 15px gold}
.ad-note{background:#fff3cd;border:1px solid gold;border-radius:10px;padding:8px;margin:10px 0;color:#664d03;font-size:11px;text-align:left}
</style>
</head>
<body>
<div class="logo-box">TC</div>
<h2 style="color:gold;margin:5px 0">TC UniScan Box</h2>
<p style="font-size:11px;color:#aaa;margin:0">Powered by Tandoh Caleb | V5 DETAILED</p>
<div class="box">
<h3 style="margin-top:0">📦 Universal Super Scanner</h3>
<div class="ad-note">💰 <b>How ads work:</b> When you click SCAN, ad opens in new tab. Just close that tab (X) to return here and see your result. That's how TC Box stays free!</div>
<div class="tabs">
<button class="tab active" id="tabUpload" onclick="switchMode('upload')">📁 Upload</button>
<button class="tab" id="tabCamera" onclick="switchMode('camera')">📷 Camera</button>
</div>
<div id="uploadDiv"><input type="file" id="photo" accept="image/*" style="width:100%;padding:10px;background:#f9f9f9;border-radius:10px"></div>
<div id="cameraDiv" style="display:none">
<video id="video" autoplay playsinline></video>
<button class="btn-dark" id="openCam" onclick="startCamera()">▶️ Open Camera</button>
<button class="btn-dark" id="snapBtn" style="display:none" onclick="takePhoto()">📸 Capture</button>
<button class="btn-dark" id="flipBtn" style="display:none" onclick="flipCamera()">🔄 Flip</button>
</div>
<img id="preview"><canvas id="canvas" style="display:none"></canvas>
<div id="result"></div>
<button class="btn-tc" id="btn" style="display:none;" onclick="scanEverything()">🔍 SCAN EVERYTHING - DETAILED</button>
<button class="btn-green" id="shareBtn" style="display:none;" onclick="shareResult()">📲 Share Detailed Report</button>
<div style="font-size:10px;color:#888;margin-top:12px">© 2026 TC UniScan Box | Tandoh Caleb | V5 Detailed AI</div>
</div>
<script>
let p=document.getElementById('photo'),pr=document.getElementById('preview'),r=document.getElementById('result'),b=document.getElementById('btn'),shareBtn=document.getElementById('shareBtn');
let video=document.getElementById('video'),canvas=document.getElementById('canvas'),snapBtn=document.getElementById('snapBtn'),openCam=document.getElementById('openCam'),flipBtn=document.getElementById('flipBtn');
let stream=null,facing="user",lastScan="";

function getDetailedData(){
 const d=[
  {t:"Person / Human",i:"🧑",cat:"Human",items:[
   "Type: Human Being Detected",
   "Age Estimate: 22-28 years",
   "Gender: Analyzed",
   "Face: 95% Clear Visibility",
   "Expression: Happy / Neutral",
   "Skin Tone: Analyzed",
   "Eye Color: Detected",
   "Hair: Style & Color Detected",
   "Height Estimate: ~5'7 - 5'11",
   "Clothing: T-Shirt + Jeans",
   "Posture: Standing Upright",
   "Background: Indoor/Outdoor",
   "Image Quality: 96% HD"
  ]},
  {t:"Smartphone / Laptop",i:"📱",cat:"Electronics",items:[
   "Category: Electronic Device",
   "Device Type: Smartphone / iPhone / Android",
   "Brand: Apple / Samsung / Tecno Detected",
   "Screen: 6.1-6.7 inch",
   "Color: Black / Gold / Silver",
   "Condition: 92% New - No Scratches",
   "Estimated Value: $250 - $900",
   "Camera: Triple Lens Detected",
   "Storage: 128GB/256GB Estimated",
   "OS: iOS / Android",
   "Battery Health: Good",
   "Year: 2023-2025 Model"
  ]},
  {t:"Car / Vehicle",i:"🚗",cat:"Vehicle",items:[
   "Type: 4-Wheel Automobile",
   "Category: Sedan / SUV",
   "Color: Black / White / Silver",
   "Condition: Clean & Well Maintained",
   "Brand: Toyota / Honda / Benz Estimated",
   "Doors: 4 Doors",
   "Estimated Year: 2018-2024",
   "Plate: Detected (Blurred for Privacy)",
   "Location: Road / Parking",
   "Lighting: Daylight - Clear",
   "Value Estimate: $8,000 - $25,000"
  ]},
  {t:"Food / Meal",i:"🍔",cat:"Food",items:[
   "Category: Food & Edible",
   "Type: Jollof / Rice / Fruit / Fast Food",
   "Freshness: 94% Fresh - Good to Eat",
   "Temperature: Warm / Hot",
   "Calories: ~350-600 kcal Estimated",
   "Ingredients: Rice, Oil, Meat, Vegetables",
   "Health Score: 7.5/10",
   "Cooking Style: Fried / Boiled / Grilled",
   "Portion: 1 Person Serving",
   "Hygiene: Clean - Safe"
  ]},
  {t:"Animal - Dog / Cat",i:"🐶",cat:"Animal",items:[
   "Living Being: Animal Detected",
   "Species: Dog / Cat / Goat",
   "Breed: Local / Foreign Breed",
   "Age: 1-3 Years Estimated",
   "Color: Brown / Black / White",
   "Health: 95% Healthy & Active",
   "Mood: Happy & Playful",
   "Fur: Clean & Shiny",
   "Weight: 10-25kg Estimated",
   "Location: Home / Outdoor",
   "Behavior: Friendly"
  ]},
  {t:"House / Building",i:"🏠",cat:"Structure",items:[
   "Type: Residential Building",
   "Structure: Single / Story Building",
   "Material: Block & Cement / Glass",
   "Color: Cream / White / Brown",
   "Condition: 90% Good",
   "Architecture: Modern African Style",
   "Roof: Aluminum / Slate",
   "Windows: Glass - 4-6 Detected",
   "Location: Urban Area",
   "Value: $30k - $150k Estimated",
   "Environment: Clean Surrounding"
  ]},
  {t:"Document / Text / Book",i:"📄",cat:"Document",items:[
   "Content Type: Text / Document",
   "Language: English Detected",
   "Words: ~150-300 Words Estimated",
   "Font: Printed / Handwritten",
   "Quality: Clear & Readable",
   "Pages: 1 Page Visible",
   "Category: School / Business / Letter",
   "Paper: White A4",
   "Ink: Black - Clear",
   "Importance: High / Medium"
  ]},
  {t:"Fashion / Clothes / Shoe",i:"👟",cat:"Fashion",items:[
   "Category: Fashion & Apparel",
   "Item: Shoe / Shirt / Dress / Trousers",
   "Brand: Nike / Adidas / Local Brand",
   "Color: Black / White / Multi",
   "Material: Leather / Cotton / Fabric",
   "Size: M / L / 42-44 Estimated",
   "Condition: New / Clean",
   "Style: Trendy / Casual / Corporate",
   "Gender: Unisex / Male / Female",
   "Price Estimate: $15 - $120",
   "Season: All Season"
  ]}
 ];
 return d[Math.floor(Math.random()*d.length)];
}

function switchMode(m){document.getElementById('tabUpload').classList.toggle('active',m=='upload');document.getElementById('tabCamera').classList.toggle('active',m=='camera');document.getElementById('uploadDiv').style.display=m=='upload'?'block':'none';document.getElementById('cameraDiv').style.display=m=='camera'?'block':'none';if(m!='camera') stopCamera();}
p.onchange=e=>{let f=e.target.files[0];if(f) loadImage(URL.createObjectURL(f));};
function loadImage(s){pr.src=s;pr.style.display='block';video.style.display='none';b.style.display='block';r.innerHTML='';shareBtn.style.display='none';}
async function startCamera(){stopCamera();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});video.srcObject=stream;video.style.display='block';pr.style.display='none';snapBtn.style.display='block';flipBtn.style.display='block';openCam.style.display='none';}catch(e){alert("Allow camera permission & use HTTPS");}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function flipCamera(){facing=facing=="user"?"environment":"user";startCamera();}
function takePhoto(){canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);let d=canvas.toDataURL('image/jpeg');stopCamera();video.style.display='none';snapBtn.style.display='none';flipBtn.style.display='none';openCam.style.display='block';openCam.innerText="🔁 Retake";loadImage(d);}
function scanEverything(){
 b.style.display='none';
 r.innerHTML='<p>⏳ TC BOX Deep Scanning...<br>🔍 AI reading EVERY detail...</p><div class="bar"><div class="fill" id="fill"></div></div><p style="font-size:11px">Scanning: Object, Color, Size, Brand, Value, Quality, Background, Lighting... (Ad opens in new tab, close it to see result)</p>';
 let fill=document.getElementById('fill');setTimeout(()=>fill.style.width='100%',100);
 setTimeout(()=>{
  let data=getDetailedData();
  let conf=Math.floor(Math.random()*8)+92;
  lastScan=`Scanned ${data.t} with ${conf}% confidence on TC UniScan Box`;
  r.innerHTML=`
   <div class="card" style="background:linear-gradient(90deg,#fff9db,#fff);border-left:5px solid gold">
    <h2 style="margin:0">${data.i} ${data.t}</h2>
    <p style="margin:5px 0"><b>Category: ${data.cat}</b></p>
    <div class="bar"><div class="fill" style="width:${conf}%"></div></div>
    <b>Confidence: ${conf}% - TC Box Verified ✅</b>
   </div>
   <div class="card">
    <b>📋 FULL DETAILED REPORT (${data.items.length} Points):</b><br><br>
    ${data.items.map((x,i)=>`${i+1}. ${x}`).join('<br>')}
   </div>
   <div class="card" style="background:#e8f5e9;border-left-color:#00b894">
    <b>🤖 AI Summary:</b><br>
    TC UniScan Box analyzed this image with advanced AI. Detected <b>${data.t}</b> with <b>${conf}%</b> accuracy. ${data.items.length} detailed features extracted. Engine: TC AI v5.0 by Tandoh Caleb. Image quality: HD. Scan time: 3.2s.
   </div>
  `;
  shareBtn.style.display='block';
 },4000);
}
function shareResult(){let t=`${lastScan} 📦 Full details inside! Try TC UniScan Box: ${location.href}`;if(navigator.share){navigator.share({title:'TC UniScan Box',text:t});}else{alert(t);}}
</script>
</body>
